name: Byori CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli-python:
    name: Multi-agent CLI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test Python contracts
        run: |
          python -m py_compile cli/byori.py mcp/byoridb_mcp.py scripts/next_release_tag.py \
            scripts/migrate-legacy-memory.py
          python -m unittest tests/test_cli.py tests/test_mcp_contract.py tests/test_mcp_lifecycle.py tests/test_release_workflow.py tests/test_memory_space.py tests/test_install_engine_tag.py tests/test_install_hooks.py

  smoke:
    name: Engine contract smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint installer
        run: bash -n install.sh templates/run-byori.sh templates/run-server.sh templates/run-mcp.sh

      # Which engine release the installer decides to install, with curl stubbed:
      # this job owns installer behaviour, and the decision is what changed.
      - name: Test installer engine-tag resolution
        run: python3 -m unittest tests/test_install_engine_tag.py tests/test_install_hooks.py

      - name: Test multi-agent CLI
        run: python3 -m unittest tests/test_cli.py

      - name: Test MCP contract
        run: python3 -m unittest tests/test_mcp_contract.py

      - name: Test memory space resolution
        run: python3 -m unittest tests/test_memory_space.py

      # Downloads the pinned ENGINE_TAG release from byoridb/byoridb and installs
      # this checkout's assets — exactly what a user install does, minus agent wiring.
      # The tag is passed explicitly: the app asks for `latest`, but this smoke test
      # is the validated pairing, so it must stay reproducible when a new engine
      # release appears.
      - name: Install (pinned engine + local assets)
        run: |
          export BYORIDB_HOME="$RUNNER_TEMP/byoridb-home"
          ENGINE_TAG="$(sed -n 's/^ENGINE_TAG_DEFAULT="\([^"]*\)".*/\1/p' install.sh)"
          test -n "$ENGINE_TAG"
          echo "pinned engine tag: $ENGINE_TAG"
          ./install.sh --assets . --engine-tag "$ENGINE_TAG" --no-claude --no-codex --no-service
          "$BYORIDB_HOME/bin/byori" --help
          # The engine binary answers no version question, so the installer's
          # record is the only build identity there is. Assert it was written.
          python3 -c 'import json, os; m = json.load(open(os.environ["BYORIDB_HOME"] + "/engine.json")); assert m["tag"], m; assert len(m["sha256"]) == 64, m; print("engine manifest:", m["tag"], m["sha256"][:12])'
          echo "BYORIDB_HOME=$BYORIDB_HOME" >> "$GITHUB_ENV"

      - name: MCP roundtrip smoke
        run: python3 tests/smoke_mcp.py

  manager-macos:
    name: Byori (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test Byori Swift core
        run: |
          swift test --package-path manager/macos
          swift run --package-path manager/macos ByoriManagerSelfTest

      - name: Build with strict concurrency checks
        run: >-
          swift build --package-path manager/macos --product ByoriManager
          -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build Byori app and development DMG
        run: VERSION=0.0.0 scripts/build-macos-dmg.sh

      - name: Verify Byori app bundle
        run: |
          INFO_PLIST="dist/Byori.app/Contents/Info.plist"
          test -x "dist/Byori.app/Contents/MacOS/Byori"
          test -f "dist/Byori.app/Contents/Resources/Byori.icns"
          test -f "dist/Byori.app/Contents/Resources/runtime/cli/byori.py"
          test "$(plutil -extract CFBundleExecutable raw "$INFO_PLIST")" = "Byori"
          test "$(plutil -extract CFBundleDisplayName raw "$INFO_PLIST")" = "Byori"
          test "$(plutil -extract CFBundleName raw "$INFO_PLIST")" = "Byori"
          test "$(plutil -extract CFBundleIdentifier raw "$INFO_PLIST")" = "io.byoridb.byori"
          codesign --verify --deep --strict --verbose=2 "dist/Byori.app"

      - name: Verify Byori disk image
        run: hdiutil verify dist/Byori-0.0.0-$(uname -m).dmg

  release-main:
    name: Tag the verified main commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [cli-python, smoke, manager-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Choose or create the next patch tag
        id: release
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          tag=$(git tag --points-at "$GITHUB_SHA" --list 'v*' \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | sort -V | tail -n 1 || true)
          if [ -z "$tag" ]; then
            release_tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease == false) | .tagName')
            main_tags=$(git tag --merged "$GITHUB_SHA" --list 'v*')
            tag=$(printf '%s\n%s\n' "$release_tags" "$main_tags" \
              | python3 scripts/next_release_tag.py --baseline v0.8.2)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$GITHUB_SHA" -m "Byori ${tag#v}"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Start release workflows
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already has a GitHub release; dispatch skipped." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -n --arg tag "$RELEASE_TAG" \
            '{event_type:"release-main",client_payload:{tag:$tag}}' \
            > "$RUNNER_TEMP/release-dispatch.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            --input "$RUNNER_TEMP/release-dispatch.json"
