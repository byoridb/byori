name: Release

on:
  repository_dispatch:
    types: [release-main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing main-contained release tag (for example v0.8.3)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Require the release tag to be on main
        run: scripts/require_release_tag_on_main.sh "$RELEASE_TAG"

      - name: Sanity check installer
        run: bash -n install.sh

      # Created as a draft on purpose. This job finishes in seconds while the
      # DMG is still being built, signed and notarised by "Release Byori", so
      # publishing here would expose a release whose only asset is install.sh.
      # The app's updater reads the newest published release and reports a
      # release with no DMG as an outright failure — for the several minutes
      # notarisation takes, every update check would fail.
      #
      # "Release Byori" publishes it once the DMG is attached. A release that
      # never gets its DMG stays a draft, which is the safe direction: no user
      # is offered an update that cannot be installed.
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          files: |
            install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
