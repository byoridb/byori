name: Release Byori

# Triggered by the tag itself rather than by `release: published`, because the
# release is created by another workflow using GITHUB_TOKEN, and events raised
# with that token never start a new workflow run. Releasing is therefore a
# single `git push origin vX.Y.Z`; the release job and this one both address the
# same release, and whichever arrives first creates it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version without the v prefix (for example 0.2.0)
        required: true
        type: string

jobs:
  package:
    name: Sign, notarize, and attach Byori DMG
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Resolve the release version
        id: release
        run: |
          # Empty on a tag push; set only when dispatched by hand.
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${{ github.ref_name }}"
          version="${version#v}"
          case "$version" in
            [0-9]*) ;;
            *) echo "::error::unexpected release version '$version'"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Require signing and notarization secrets
        run: |
          test -n "$CERTIFICATE_P12"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$SIGN_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"

      - name: Import Developer ID certificate
        env:
          KEYCHAIN_PASSWORD: ${{ runner.temp }}-${{ github.run_id }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/byori-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/byori-signing.keychain-db"
          printf '%s' "$CERTIFICATE_P12" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # A Keychain Access .p12 export carries the leaf and its private key
          # but not the issuing intermediate. Without a chain to anchor, the
          # import succeeds and codesign still reports "no identity found", so
          # bring Apple's Developer ID intermediates along. Both generations are
          # imported because a reissued certificate may move to G2.
          for authority in DeveloperIDCA DeveloperIDG2CA; do
            authority_path="$RUNNER_TEMP/$authority.cer"
            curl -fsSL "https://www.apple.com/certificateauthority/$authority.cer" \
              -o "$authority_path"
            security import "$authority_path" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          done
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Prepend rather than replace: -s discards the whole search list, and
          # the evicted keychains are where the trust anchors live.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')
          # Fails the step here, with a readable reason, rather than several
          # minutes later inside the build with codesign's opaque message.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee "$RUNNER_TEMP/identities"
          grep -q "1 valid identities found" "$RUNNER_TEMP/identities" \
            || { echo "::error::expected exactly one codesigning identity in the temporary keychain"; exit 1; }
          # MACOS_SIGN_IDENTITY is hand-entered, and a mismatch otherwise surfaces
          # minutes later as codesign's "no identity found". Note that a correct
          # secret also masks the identity name in the diagnostic above.
          grep -qF "$SIGN_IDENTITY" "$RUNNER_TEMP/identities" \
            || { echo "::error::MACOS_SIGN_IDENTITY does not name the identity in the certificate"; exit 1; }

      - name: Warn when the signing certificate is running out
        run: |
          # This job checks out the release tag, which may predate the script.
          script=scripts/check-signing-certificate.sh
          [ -x "$script" ] || { echo "no expiry check in this tag; skipping"; exit 0; }
          "$script" "$RUNNER_TEMP/byori-signing.keychain-db" 90 > "$RUNNER_TEMP/expiry" || true
          cat "$RUNNER_TEMP/expiry"
          days="$(sed -n 's/^days_left=//p' "$RUNNER_TEMP/expiry")"
          case "$(sed -n 's/^status=//p' "$RUNNER_TEMP/expiry")" in
            ok) ;;
            expiring) echo "::warning::signing certificate expires in $days days" ;;
            *) echo "::warning::signing certificate is expired" ;;
          esac

      - name: Test Byori Swift core
        run: |
          swift test --package-path manager/macos
          swift run --package-path manager/macos ByoriManagerSelfTest

      - name: Build signed universal Byori DMG
        run: |
          scripts/build-macos-dmg.sh \
            --version "${{ steps.release.outputs.version }}" \
            --universal \
            --sign "$SIGN_IDENTITY"

      - name: Notarize and staple Byori DMG
        run: |
          DMG="dist/Byori-${{ steps.release.outputs.version }}-universal.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          hdiutil verify "$DMG"

      # Uploaded with `gh`, not with an action that finds the release by tag: a
      # tag lookup through the API does not return drafts, so such an action
      # cannot see the draft the other workflow just created and makes a second
      # release for the same tag. That is what happened to v0.6.2 — install.sh
      # stayed on an invisible draft and the published release shipped without
      # it, breaking the install command in the README.
      - name: Attach Byori DMG to release
        run: |
          set -euo pipefail
          tag="v${{ steps.release.outputs.version }}"
          dmg="dist/Byori-${{ steps.release.outputs.version }}-universal.dmg"
          test -f "$dmg"
          # Normally the other workflow has already created the draft. Create it
          # here when this job won the race, or when dispatched by hand against
          # a tag that has no release yet.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                 --draft --generate-notes --title "$tag"
          gh release upload "$tag" "$dmg" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing is the last step, so a release becomes visible only once it
      # has an installable DMG. Done with the CLI rather than the action's
      # `draft` input because this must also publish a release the other
      # workflow created, and it must not race with that workflow's own write.
      - name: Publish the release now that it is installable
        run: |
          set -euo pipefail
          tag="v${{ steps.release.outputs.version }}"

          # Verified before publishing, not after: a release that goes public
          # without a DMG is the exact state this ordering exists to prevent.
          # `--draft` is only honoured on a release that is still a draft, so
          # this also covers a re-run against an already published one.
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[].name] | join(" ")')
          echo "assets: $assets"
          case " $assets " in
            *" install.sh "*) ;;
            *)
              # The README, the docs and the app's own online update all fetch
              # releases/latest/download/install.sh. Publishing without it
              # breaks the documented install command.
              echo "::error::$tag has no install.sh asset; refusing to publish it."
              exit 1 ;;
          esac
          case "$assets" in
            *.dmg*) ;;
            *)
              echo "::error::$tag has no DMG asset; refusing to publish it."
              exit 1 ;;
          esac

          # Leaves the prerelease flag alone: it was set from the tag name when
          # the draft was created.
          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/byori-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/byori-signing.p12"
